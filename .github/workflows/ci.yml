name: CI - Comprehensive Quality Checks & Auto-Promote

on:
  push:
    branches: [ master, main, 'feature/**', 'hotfix/**', 'fix/**' ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  test-and-build:
    name: Validate All Checks & Build
    runs-on: ubuntu-24.04

    # Build-time environment variables for headless validation
    env:
      DATABASE_URL: "mysql://dummy:dummy@localhost:3306/pms"
      AUTH_SECRET: "ci-dummy-auth-secret-minimum-32-chars-long"
      NEXTAUTH_SECRET: "ci-dummy-auth-secret-minimum-32-chars-long"
      NEXTAUTH_URL: "http://localhost:3000"
      WC_STORE_URL: "https://lk-tronics.com"
      WC_CONSUMER_KEY: "ck_ci_mock_test_key"
      WC_CONSUMER_SECRET: "cs_ci_mock_test_secret"

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Verify Dependencies (npm ci)
        run: npm ci

      - name: 4. Scan Dependencies for Vulnerabilities (Block on High/Critical)
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical

      - name: 5. Validate Prisma Schema
        run: npx prisma validate

      - name: 6. Generate Prisma Client
        run: npx prisma generate

      - name: 7. Run Strict TypeScript Type Check
        run: npx tsc --noEmit

      - name: 8. Run Unit Tests (Calculations, Validity, Schemas, Formatters)
        run: npm run test:unit

      - name: 9. Run Security & Optimization Tests (OWASP, Rate Limiting, Fuzzy Search, Auth)
        run: npm run test:security

      - name: 10. Run Full Automated Test Suite
        run: npm test

      - name: 11. Validate Next.js Production Build
        run: npm run build

  promote-to-main:
    name: Promote Master to Main
    needs: test-and-build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Main with Master and Push
        run: |
          git checkout main
          git merge origin/master --no-edit -m "chore: sync main with master [skip ci]" || git reset --hard origin/master
          git push origin main
